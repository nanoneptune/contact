<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Contacts & Mailer - Ambient Minimalist</title>
    
    <!-- PWA Manifest and Identity -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5e5ce6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d11" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Minimalist Ambient Contacts Directory with Markdown Mailer, Telegram Bot Sync, and AI Voice Talkback." />
    
    <!-- Apple Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Contacts" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration optional in dev
          });
        });
      }
    </script>
  </body>
</html>
