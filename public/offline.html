<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Contacts & Messaging Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fbfbfd;
      color: #1a1a1e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(94, 92, 230, 0.1);
      color: #5e5ce6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #5e5ce6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4b48d6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are currently offline</h1>
    <p>Contact Directory and locally cached data are available. Connect to the internet to sync updates with Telegram, Mailer, and Supabase.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
